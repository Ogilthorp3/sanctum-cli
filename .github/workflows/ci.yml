name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # sanctum-cli is a macOS product (launchctl, keychain, networksetup,
    # system_profiler). Run CI on macOS so the platform tests collect and
    # run honestly — on Linux they crash at import (no launchctl).
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # self-hosted runner: setup-python's default toolcache (/Users/runner/...)
      # is not writable here; point it at a writable dir on the manoir runner.
      RUNNER_TOOL_CACHE: /Users/bert/.sanctum/gh-runner/_toolcache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install restic
        run: brew install restic

      - name: Install package + dev deps
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check sanctum_cli tests

      - name: Type-check (mypy)
        run: mypy sanctum_cli

      - name: Test (pytest)
        run: pytest
