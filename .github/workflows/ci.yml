name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # sanctum-cli is a macOS product (launchctl, keychain, networksetup,
    # system_profiler). Run CI on macOS so the platform tests collect and
    # run honestly — on Linux they crash at import (no launchctl).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12 (self-hosted venv)
        # actions/setup-python's prebuilt macOS Python hardcodes /Users/runner and
        # can't self-install on a self-hosted Mac. Use the runner's brew python@3.12
        # in a venv; its bin goes first on PATH so `python`/`pip` are 3.12 for all steps.
        run: |
          /opt/homebrew/bin/python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install restic
        run: brew install restic

      - name: Install package + dev deps
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check sanctum_cli tests

      - name: Type-check (mypy)
        run: mypy sanctum_cli

      - name: Test (pytest)
        run: pytest
