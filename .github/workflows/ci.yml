name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # sanctum-cli is a macOS product (launchctl, keychain, networksetup,
    # system_profiler). Run CI on macOS so the platform tests collect and
    # run honestly — on Linux they crash at import (no launchctl).
    # GitHub-hosted, not self-hosted: this repo is public, and for pull_request
    # events GitHub runs the fork's own copy of this file, so a self-hosted
    # label would let any fork run code on a haus machine.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install restic
        run: brew install restic

      - name: Install package + dev deps
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check sanctum_cli tests

      - name: Type-check (mypy)
        run: mypy sanctum_cli

      - name: Test (pytest)
        run: pytest
