# Watchdog catalog entry for the endocrine gland (the seventh organ).
#
# STAGED — append to ~/.sanctum/services/ as endocrine-gland.yaml (or merge into
# the catalog) when Bert turns the organ on. Liveness/startup use the `command`
# check type — the only freshness-capable primitive service-graph.py supports
# (its enum is command|http|port|process|interface; there is NO file-fresh
# primitive). The Living Force (sanctum-watchdog) then monitors the gland; the
# endocrine-gland-sentinel owns the pathological-state paging (damped via
# alert-confirm.sh).
name: endocrine-gland
display_name: Endocrine Gland (hormone panel)
host: mac
type: service
provides:
- endocrine
- hormone-panel
requires:
- chitti        # reads /fluid for the cortisol memory-pressure signal
launchagent: com.sanctum.endocrine-gland
health:
  # The gland is a StartInterval tick, not a long-running PID. GLAND_DOWN means
  # the loop stopped: panel missing, unparseable, or stale with no beat-seen
  # inside STALE_SEC. STEP_LAG (stale panel, fresh beat-seen) is not a page —
  # beats are still being scheduled and dying before publish. A probe that
  # exits 0 iff the verdict is NOT GLAND_DOWN stays green for STEP_LAG.
  # We use `command` because it is the only freshness-capable primitive
  # service-graph.py dispatches (there is no file-fresh check type).
  startup:
    type: command
    command: >-
      /usr/bin/python3 /Users/bert/.sanctum/sentinels/endocrine-gland-sentinel.py --check
      | grep -qv '"state": "GLAND_DOWN"'
    timeout: 15
  liveness:
    type: command
    command: >-
      /usr/bin/python3 /Users/bert/.sanctum/sentinels/endocrine-gland-sentinel.py --check
      | grep -qv '"state": "GLAND_DOWN"'
    timeout: 15
remediation:
  responsible_agent: cilghal   # the endocrinologist — monitors + doses creative mode
  escalation_level: 1
  max_restarts: 3
  cooldown: 120
  restart_cmd: /Users/bert/Documents/Claude_Code/tools/heal_launchagent.sh com.sanctum.endocrine-gland /Users/bert/Library/LaunchAgents/com.sanctum.endocrine-gland.plist
  actions:
  - name: heal-launchagent
    cmd: /Users/bert/Documents/Claude_Code/tools/heal_launchagent.sh com.sanctum.endocrine-gland /Users/bert/Library/LaunchAgents/com.sanctum.endocrine-gland.plist
metadata:
  generated_from: deploy/endocrine (sanctum-cli feat/endocrine-system)
  organ: endocrine
  note: >-
    ADDITIVE + off-by-default. A running gland publishes a NEUTRAL panel until a
    seat opts in (SANCTUM_ENDOCRINE=1) and the operator doses creative mode.
    Mon Mothma governs the stress axis; Cilghal monitors + doses creative mode.
