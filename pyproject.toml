[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanctum-cli"
version = "0.10.2"
description = "Unified terminal binary for Sanctum hosts — router, wizard, doctor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FSL-1.1-MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Bertrand Nepveu" }]
keywords = ["sanctum", "cli", "backup", "claude", "gemini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "platformdirs>=4.2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "google-genai>=0.3",
]

[project.optional-dependencies]
# The Sagemcom F@st (Bell "Home Hub") SAH transport. It is an OPTIONAL runtime
# dependency — the provider imports it lazily and degrades with a "pip install
# sagemcom_api" hint if absent (see sanctum_cli/devices/sagemcom.py) — but the
# boundary test in tests/devices/test_sagemcom_boundary.py drives the REAL
# library encoding path on purpose, so it must be in any install set that runs
# the gate. `dev` includes `hub` so `pip install -e ".[dev]"` (what make
# check / CI / the overnight gate use) brings it in; the test still
# `pytest.importorskip`s it so a contributor without the extra SKIPs (not ERRORs).
hub = [
  "sagemcom_api>=1.4,<2",
]
# The NETGEAR Orbi SOAP transport. Like `hub`, it is an OPTIONAL runtime
# dependency — the Orbi provider imports it lazily inside _make_client and
# degrades with a "pip install pynetgear" hint if absent (see
# sanctum_cli/devices/orbi.py). The unit tests mock the factory so they run
# without it, but `dev` includes `orbi` so the gate / CI install set has it.
orbi = [
  "pynetgear>=0.10,<1",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
  "sanctum-cli[hub]",
  "sanctum-cli[orbi]",
]

[project.scripts]
sanctum = "sanctum_cli.cli:app"

[project.urls]
Spec = "file://./SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["sanctum_cli"]

# ─── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# deploy/ holds daemon-side artifacts (staged plists + a standalone sentinel) that
# run from ~/.sanctum WITHOUT this package on PYTHONPATH; the sentinel is stdlib-only
# and follows the sibling ~/.sanctum/sentinels/ idioms (os.path), not the package's
# pathlib-strict rules. It is verified via its own --self-test, not this linter.
extend-exclude = [".venv", "build", "dist", "deploy"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "TCH",  # type-checking
  "PTH",  # pathlib
  "ARG",  # unused arguments
  "N",    # pep8-naming
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]
# The endocrine package documents a control-theory regulator; its docstrings and
# comments use deliberate mathematical notation (the minus sign − vs hyphen, the
# Greek α leak gain, ×/·/≈/⊣/→) where the glyph IS the meaning. RUF002/RUF003
# would have us mangle the math into ASCII; the notation is intentional, not a
# typo, so it is allowed here (and only here).
"sanctum_cli/endocrine/*.py" = ["RUF002", "RUF003"]
"tests/test_endocrine.py" = ["ARG", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# sagemcom_api (the SAH transport for the Sagemcom hub provider) ships no
# py.typed marker and no stubs. It is imported lazily inside _make_client and
# wrapped behind the typed DeviceProvider surface, so treat it as untyped.
[[tool.mypy.overrides]]
module = "sagemcom_api.*"
ignore_missing_imports = true

# pynetgear (the SOAP transport for the Orbi provider) likewise ships no py.typed
# marker and no stubs. It is imported lazily inside orbi._make_client and wrapped
# behind the typed DeviceProvider surface, so treat it as untyped.
[[tool.mypy.overrides]]
module = "pynetgear.*"
ignore_missing_imports = true

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "no_haus_stub: opt out of the autouse haus-present stub (gate's own tests).",
]

[tool.coverage.run]
branch = true
source = ["sanctum_cli"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
