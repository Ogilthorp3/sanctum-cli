[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanctum-cli"
version = "0.9.0"
description = "Unified terminal binary for Sanctum hosts — router, wizard, doctor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — see SPEC.md" }
authors = [{ name = "Bertrand Nepveu" }]
keywords = ["sanctum", "cli", "backup", "claude", "gemini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "platformdirs>=4.2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
sanctum = "sanctum_cli.cli:app"

[project.urls]
Spec = "file://./SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["sanctum_cli"]

# ─── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# deploy/ holds daemon-side artifacts (staged plists + a standalone sentinel) that
# run from ~/.sanctum WITHOUT this package on PYTHONPATH; the sentinel is stdlib-only
# and follows the sibling ~/.sanctum/sentinels/ idioms (os.path), not the package's
# pathlib-strict rules. It is verified via its own --self-test, not this linter.
extend-exclude = [".venv", "build", "dist", "deploy"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "TCH",  # type-checking
  "PTH",  # pathlib
  "ARG",  # unused arguments
  "N",    # pep8-naming
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]
# The endocrine package documents a control-theory regulator; its docstrings and
# comments use deliberate mathematical notation (the minus sign − vs hyphen, the
# Greek α leak gain, ×/·/≈/⊣/→) where the glyph IS the meaning. RUF002/RUF003
# would have us mangle the math into ASCII; the notation is intentional, not a
# typo, so it is allowed here (and only here).
"sanctum_cli/endocrine/*.py" = ["RUF002", "RUF003"]
"tests/test_endocrine.py" = ["ARG", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sanctum_cli"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
